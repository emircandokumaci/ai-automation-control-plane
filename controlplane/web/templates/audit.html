{% extends "base.html" %}{% block content %}<h1>Audit trail</h1><div class="table-wrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Object</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{ r.created_at.strftime('%Y-%m-%d %H:%M:%S') }}</td><td>{{ r.actor_type }}:{{ r.actor_id }}</td><td>{{ r.action }}</td><td>{{ r.object_type }} {{ r.object_id or '' }}</td></tr>{% else %}<tr><td colspan="4" class="muted">No audit entries.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
