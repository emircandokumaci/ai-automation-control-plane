<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{% block title %}AI Automation Control Plane{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <div>
    <div class="eyebrow">SELF-HOSTED OPERATIONS</div>
    <a class="brand" href="/">AI Automation Control Plane</a>
  </div>
  {% if user %}<form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="ghost" type="submit">Sign out</button></form>{% endif %}
</header>
{% if user %}
<nav class="nav" aria-label="Primary">
  <a href="/">Health</a><a href="/projects">Projects</a><a href="/jobs">Jobs</a><a href="/failures">Failures</a><a href="/schedules">Schedules</a><a href="/workers">Workers</a><a href="/audit">Audit</a>
</nav>
{% endif %}
<main id="main" class="wrap">{% block content %}{% endblock %}</main>
<footer class="footer">Durable · Idempotent · Observable · Recoverable · Deterministic</footer>
</body>
</html>
